[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-testing-mcdynect"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.54,<2.0",
    "pytest>=8.4,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest-html>=4.1,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "licensee: Licensee-specific tests",
]
norecursedirs = [
    ".git",
    ".idea",
    ".pw_home",
    ".pytest_cache",
    ".venv",
    "results",
    "test_runs",
]

[tool.setuptools]
packages = [
    "abilities",
    "actors",
    "config",
    "questions",
    "questions.licensee",
    "tasks",
    "tasks.licensee",
    "tests",
    "tests.licensee",
    "ui",
]
